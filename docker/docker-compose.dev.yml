version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: handwerker-db
    environment:
      POSTGRES_USER: handwerker
      POSTGRES_PASSWORD: handwerker_dev
      POSTGRES_DB: handwerker_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handwerker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
